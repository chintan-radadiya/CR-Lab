<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CAT Critical Reasoning Practice Lab</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #fff;
      --text: #111827;
      --muted: #667085;
      --line: #e6e8ec;
      --accent: #2563eb;
      --accent-2: #eef4ff;
      --good: #16803c;
      --bad: #c62828;
      --warn: #b7791f;
      --shadow: 0 8px 30px rgba(17, 24, 39, .06);
      --radius: 16px
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .app {
      min-height: 100vh
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line)
    }

    .topbar-inner {
      max-width: 1280px;
      margin: auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 18px
    }

    .brand {
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap
    }

    .brand small {
      font-weight: 500;
      color: var(--muted);
      margin-left: 6px
    }

    .nav {
      display: flex;
      gap: 4px;
      overflow: auto
    }

    .nav button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      white-space: nowrap
    }

    .nav button.active {
      background: #eef2f7;
      color: var(--text);
      font-weight: 700
    }

    .spacer {
      flex: 1
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px
    }

    .main {
      max-width: 1280px;
      margin: auto;
      padding: 22px 18px 40px
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 8px 0 18px
    }

    .section-head h1 {
      font-size: 26px;
      line-height: 1.15;
      margin: 0;
      letter-spacing: -.03em
    }

    .section-head p {
      margin: 6px 0 0;
      color: var(--muted)
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .grid.cards {
      grid-template-columns: repeat(4, minmax(0, 1fr))
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px
    }

    .metric .label {
      font-size: 12px;
      color: var(--muted)
    }

    .metric .value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-top: 3px
    }

    .metric .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow: auto;
      margin: 0 0 14px
    }

    .tabs button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      white-space: nowrap
    }

    .tabs button.active {
      color: var(--accent);
      border-color: #b9cdfc;
      background: var(--accent-2);
      font-weight: 700
    }

    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: 650
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    .btn.ghost {
      background: transparent
    }

    .btn.danger {
      color: var(--bad);
      border-color: #f0c4c4
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .btn.small {
      padding: 6px 9px;
      font-size: 13px
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .wrap {
      flex-wrap: wrap
    }

    .between {
      justify-content: space-between
    }

    .muted {
      color: var(--muted)
    }

    .tiny {
      font-size: 12px
    }

    .empty {
      padding: 36px 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 14px
    }

    .test-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px
    }

    .test-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .test-title {
      font-weight: 800
    }

    .test-meta {
      font-size: 12px;
      color: var(--muted)
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px
    }

    .topic-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff
    }

    .topic-card h3 {
      margin: 0;
      font-size: 15px
    }

    .topic-card .count {
      font-size: 24px;
      font-weight: 800;
      margin: 8px 0
    }

    .select,
    .input,
    .textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 9px 10px;
      color: var(--text)
    }

    .textarea {
      min-height: 84px;
      resize: vertical
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center
    }

    .bar-chart {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(110px, 170px) 1fr 44px;
      gap: 10px;
      align-items: center
    }

    .bar-track {
      height: 9px;
      background: #edf0f5;
      border-radius: 999px;
      overflow: hidden
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px
    }

    .line-chart {
      height: 230px
    }

    .line-chart svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .legend {
      font-size: 11px;
      fill: #667085
    }

    .axis {
      stroke: #e7e9ee;
      stroke-width: 1
    }

    .line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3
    }

    .dot {
      fill: #fff;
      stroke: var(--accent);
      stroke-width: 2
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px
    }

    .table th,
    .table td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top
    }

    .table th {
      background: #fafbfc;
      font-size: 12px;
      color: var(--muted);
      position: sticky;
      top: 0
    }

    .table tr:last-child td {
      border-bottom: 0
    }

    .good {
      color: var(--good)
    }

    .bad {
      color: var(--bad)
    }

    .warn {
      color: var(--warn)
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .42);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50
    }

    .modal-card {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--line);
      padding: 20px;
      box-shadow: 0 25px 70px rgba(15, 23, 42, .25)
    }

    .danger-modal .modal-card {
      width: min(480px, 100%);
      border: 1px solid #7f3040;
      background: linear-gradient(145deg, #26131b, #17131d);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 113, 135, .12)
    }

    .warning-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #4a1823;
      color: #ff8ca0;
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 0 0 8px rgba(255, 113, 135, .08)
    }

    .danger-modal h2 {
      margin: 16px 0 6px;
      color: #ff9aaa
    }

    .danger-modal p {
      color: #b8bfd0
    }

    .danger-modal .warning-box {
      padding: 11px 13px;
      border: 1px solid #63303a;
      border-radius: 10px;
      background: #30151d;
      color: #ffc1cb;
      font-size: 13px
    }

    .btn.danger-solid {
      color: #fff;
      border-color: #d8445d;
      background: linear-gradient(135deg, #e34e66, #b92f48);
      box-shadow: 0 7px 18px rgba(210, 53, 78, .24)
    }

    .pause-modal { background: rgba(4, 7, 15, .88); backdrop-filter: blur(8px) }
    .pause-modal .modal-card { width: min(430px, 100%); text-align: center; border-color: #464d82; background: linear-gradient(145deg, #1b2140, #111827) }
    .pause-icon { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 18px; background: linear-gradient(135deg, #7475ed, #5556c9); color: #fff; font-size: 24px; font-weight: 900; box-shadow: 0 10px 28px rgba(91, 92, 226, .35) }
    .pause-modal h2 { margin: 0 0 7px; color: #d3d4ff }
    .pause-modal p { margin: 0 0 18px; color: var(--muted) }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #111827;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      z-index: 60;
      box-shadow: var(--shadow)
    }

    .practice-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 16px
    }

    .q-panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line)
    }

    .q-num {
      font-weight: 800
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-weight: 800
    }

    .timer.danger {
      color: var(--bad)
    }

    .q-stem {
      font-size: 17px;
      line-height: 1.65;
      margin: 20px 0
    }

    .choice {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      margin: 9px 0;
      background: #fff;
      transition: .15s
    }

    .choice:hover {
      border-color: #b8c6df;
      background: #fbfdff
    }

    .choice.selected {
      border-color: #8db0f5;
      background: #f5f8ff
    }

    .choice input {
      margin-top: 4px
    }

    .choice .letter {
      font-weight: 800;
      flex: 0 0 20px
    }

    .q-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line)
    }

    .q-nav {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      height: max-content;
      position: sticky;
      top: 78px
    }

    .q-nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px
    }

    .q-dot {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 7px 0;
      font-size: 12px
    }

    .q-dot.current {
      border-color: var(--accent);
      background: var(--accent-2);
      color: var(--accent);
      font-weight: 800
    }

    .q-dot.answered {
      background: #eef8f1;
      border-color: #cce5d2
    }

    .q-dot.flagged {
      box-shadow: inset 0 -3px 0 var(--warn)
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px
    }

    .score {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -.04em
    }

    .review-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 14px
    }

    .answer-key {
      font-weight: 800
    }

    .source-note {
      color: var(--muted);
      font-size: 12px
    }

    .solution-panel { margin-top: 14px; padding: 15px; border: 1px solid #315b55; border-radius: 14px; background: linear-gradient(145deg, rgba(29, 92, 78, .22), rgba(24, 35, 57, .85)); animation: completeRise .35s ease-out both }
    .solution-panel.incorrect { border-color: #673641; background: linear-gradient(145deg, rgba(112, 40, 55, .20), rgba(24, 35, 57, .85)) }
    .solution-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; font-weight: 800 }
    .solution-answer { margin: 9px 0; padding: 10px 12px; border-radius: 10px; background: rgba(9, 13, 24, .52); color: #e8edff }
    .solution-reasoning { color: #bac4da; font-size: 13px; line-height: 1.65 }
    .solution-disclaimer { margin-top: 9px; color: #8491ac; font-size: 11px }
    .analysis-modal .modal-card { width: min(820px, 100%); text-align: left }
    .analysis-modal .q-stem { margin: 14px 0; font-size: 15px }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 30px
    }

    /* Colorful study-lab theme */
    :root {
      --bg: #f5f7ff;
      --panel: #fff;
      --text: #17203b;
      --muted: #65708c;
      --line: #e1e6f4;
      --accent: #5b5ce2;
      --accent-2: #eeefff;
      --good: #15966a;
      --bad: #df4d64;
      --warn: #e99b2d;
      --shadow: 0 12px 34px rgba(62, 68, 135, .10);
      --radius: 18px
    }

    html,
    body {
      background: radial-gradient(circle at 8% 5%, rgba(91, 92, 226, .11), transparent 24rem), radial-gradient(circle at 94% 18%, rgba(35, 190, 168, .10), transparent 22rem), var(--bg)
    }

    .topbar {
      background: rgba(250, 251, 255, .88);
      border-bottom-color: rgba(91, 92, 226, .13);
      box-shadow: 0 5px 25px rgba(58, 63, 122, .06)
    }

    .brand {
      color: #4546bd;
      font-size: 17px
    }

    .brand::before {
      content: '✦';
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-right: 8px;
      border-radius: 9px;
      color: #fff;
      background: linear-gradient(135deg, #696af0, #37bca5);
      box-shadow: 0 6px 14px rgba(91, 92, 226, .28)
    }

    .nav button,
    .btn,
    .tabs button,
    .choice,
    .test-card,
    .topic-card,
    .card {
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease
    }

    .nav button:hover {
      color: var(--accent);
      background: var(--accent-2)
    }

    .nav button.active {
      color: #fff;
      background: linear-gradient(135deg, #6263e9, #5455d4);
      box-shadow: 0 5px 13px rgba(91, 92, 226, .22)
    }

    .card {
      border-color: rgba(106, 115, 175, .18);
      box-shadow: var(--shadow)
    }

    .card:hover {
      border-color: rgba(91, 92, 226, .24)
    }

    .metric {
      position: relative;
      overflow: hidden
    }

    .metric::after {
      content: '';
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      right: -32px;
      top: -38px;
      background: linear-gradient(135deg, rgba(91, 92, 226, .17), rgba(35, 190, 168, .11))
    }

    .metric:nth-child(2)::after {
      background: rgba(35, 190, 168, .16)
    }

    .metric:nth-child(3)::after {
      background: rgba(233, 155, 45, .16)
    }

    .metric:nth-child(4)::after {
      background: rgba(223, 77, 100, .14)
    }

    .metric .value,
    .score {
      background: linear-gradient(135deg, #4b4cc8, #26a991);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 7px 16px rgba(57, 63, 117, .13)
    }

    .btn.primary {
      border: 0;
      background: linear-gradient(135deg, #6667ed, #4f50cc);
      box-shadow: 0 7px 17px rgba(91, 92, 226, .25)
    }

    .test-card,
    .topic-card,
    .q-panel,
    .q-nav,
    .review-item {
      border-color: rgba(106, 115, 175, .2)
    }

    .test-card:hover,
    .topic-card:hover {
      transform: translateY(-3px);
      border-color: rgba(91, 92, 226, .34);
      box-shadow: 0 12px 25px rgba(62, 68, 135, .10)
    }

    .choice:hover {
      transform: translateX(3px);
      border-color: #a4a5ef;
      background: #f7f7ff
    }

    .choice.selected {
      border-color: #7475e8;
      background: linear-gradient(90deg, #f0f0ff, #f5fffd);
      box-shadow: inset 4px 0 #5b5ce2
    }

    .bar-track {
      height: 11px;
      background: #e9ecf7
    }

    .bar-fill {
      background: linear-gradient(90deg, #6263e9, #28b9a4);
      box-shadow: 0 0 10px rgba(54, 173, 161, .25);
      transform-origin: left;
      animation: barGrow .8s cubic-bezier(.22, .8, .3, 1) both;
      animation-delay: var(--delay, 0ms)
    }

    .line {
      stroke: url(#chartGradient);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1600;
      stroke-dashoffset: 1600;
      animation: drawLine 1.35s cubic-bezier(.4, 0, .2, 1) forwards
    }

    .dot {
      stroke: #5b5ce2;
      animation: dotPop .38s ease-out both;
      transform-box: fill-box;
      transform-origin: center
    }

    .line-chart {
      margin-top: 12px
    }

    .line-chart svg {
      overflow: visible
    }

    .table th {
      background: #f4f5ff
    }

    .pill {
      border-color: #dfe2f2;
      background: #fafaff
    }

    .toast {
      background: linear-gradient(135deg, #292b59, #4546a8);
      animation: toastIn .3s ease-out
    }

    #error-filter {
      display: none
    }

    .completion-hero {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border: 1px solid rgba(91, 92, 226, .19);
      border-radius: 22px;
      background: linear-gradient(115deg, #f0efff, #effbfa 55%, #fff6e8);
      box-shadow: 0 15px 36px rgba(62, 68, 135, .11);
      animation: completeRise .65s cubic-bezier(.18, .9, .25, 1) both
    }

    .completion-hero h1 {
      font-size: 32px;
      color: #4243b8
    }

    .completion-icon {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-right: 10px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, #19a979, #38c5ae);
      box-shadow: 0 0 0 8px rgba(35, 190, 168, .12);
      animation: completePop .75s cubic-bezier(.2, 1.5, .35, 1) both
    }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .confetti i {
      position: absolute;
      top: -12px;
      width: 8px;
      height: 16px;
      border-radius: 3px;
      background: var(--c);
      left: var(--x);
      animation: confettiFall 1.8s ease-out var(--d) both
    }

    .result-grid .card {
      animation: completeRise .55s ease-out both
    }

    .result-grid .card:nth-child(2) {
      animation-delay: .08s
    }

    .result-grid .card:nth-child(3) {
      animation-delay: .16s
    }

    .result-grid .card:nth-child(4) {
      animation-delay: .24s
    }

    .result-page>.section-head {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border: 1px solid rgba(91, 92, 226, .19);
      border-radius: 22px;
      background: linear-gradient(115deg, #f0efff, #effbfa 55%, #fff6e8);
      box-shadow: 0 15px 36px rgba(62, 68, 135, .11);
      animation: completeRise .65s cubic-bezier(.18, .9, .25, 1) both
    }

    .result-page>.section-head h1::before {
      content: '✓';
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-right: 12px;

<body>
  <div id="app"></div>
  <script src="cr_app_data.js"></script>
  <script>
    (() => {
      const DATA = window.CR_DATA;
      const STORE = 'cr_practice_lab_v1';
      const CURRENT = 'cr_practice_current_v1';
      const TOPICS = ['Assumption', 'Strengthen', 'Weaken', 'Paradox / Explain', 'Inference', 'Conclusion', 'Main Point', 'Flaw', 'Evaluate', 'Complete the Passage', 'Parallel Reasoning', 'Conditional / Deductive Logic', 'Principle', 'Method / Point at Issue', 'Role / Function', 'Argument Structure', 'Interpretation', 'Plan / Decision', 'Other'];
      const TOPIC_FAMILY = { Assumption: 'Argument Evaluation', Strengthen: 'Argument Evaluation', Weaken: 'Argument Evaluation', 'Paradox / Explain': 'Argument Evaluation', Evaluate: 'Argument Evaluation', Flaw: 'Argument Analysis', 'Main Point': 'Argument Analysis', Conclusion: 'Argument Analysis', 'Method / Point at Issue': 'Argument Analysis', 'Role / Function': 'Argument Analysis', 'Argument Structure': 'Argument Analysis', Interpretation: 'Argument Analysis', Inference: 'Deduction', 'Conditional / Deductive Logic': 'Deduction', 'Complete the Passage': 'Deduction', 'Parallel Reasoning': 'Application', Principle: 'Application', 'Plan / Decision': 'Application', Other: 'Other' };
      function classifyQuestion(q) {
        const p = q.prompt.replace(/\s+/g, ' ').toLowerCase(), tail = p.slice(-650); let topic = '';
        if (/complete(s)? (the )?(passage|argument)|best completes|most logical completion/.test(tail)) topic = 'Complete the Passage';
        else if (/point at issue|disagree about|disagreement between|responds? to .* by/.test(tail)) topic = 'Method / Point at Issue';
        else if (/parallel|most similar (in|to)|most closely (parallels|resembles)|analogous pattern|same logical (error|features?|structure)|closest.*logical features/.test(tail)) topic = 'Parallel Reasoning';
        else if (/which (one )?of .*principle|principle (above|stated)|conforms? to the (principle|rule|proposition)|application of .*principle|principle.*justif/.test(tail)) topic = 'Principle';
        else if (/resolve|reconcile|explain (the|this|why)|account for|apparent (discrepancy|paradox|conflict)|contributes most to an explanation/.test(tail)) topic = 'Paradox / Explain';
        else if (/evaluate|logical evaluation|most useful to know|most useful (for|in) (determining|assessing)|relevant to an evaluation|answer to which.*question/.test(tail)) topic = 'Evaluate';
        else if (/assum|unstated premise|depends? on|requires? which|presuppos|taken for granted|argument .* based on$/.test(tail)) topic = 'Assumption';
        else if (/weaken|undermine|cast.*doubt|refut|calls? into question|most damaging|evidence against|prediction .* inaccurate|challenge to the critics|allay|ease .* fear|argues? most strongly against/.test(tail)) topic = 'Weaken';
        else if (/strengthen|supports? (the|this|.* hypothesis|.* recommendation)|provides?.*(support|evidence)|gives? .*support|confirm|substantiat|soundness|justification for/.test(tail)) topic = 'Strengthen';
        else if (/flaw|error of reasoning|reasoning error|vulnerable to .*criticism|weak(ness| point)|best critique|questionable (because|technique)|criticism.*reasoning|jeopardizes? the validity|conclusion .* unsound|relies on$/.test(tail)) topic = 'Flaw';
        else if (/role .*play|function .*statement|serves? which.*function|use .*statement.*to/.test(tail)) topic = 'Role / Function';
        else if (/method of (reasoning|argument|persuasion)|author.s method|proceeds? by|argumentative strategy|strateg(y|ies) is used|technique of reasoning|organization of the argument|attempts? to prove.* by|does which .* in .* reply/.test(tail)) topic = 'Argument Structure';
        else if (/main point|main idea|primary purpose|best summarizes|central claim/.test(tail)) topic = 'Main Point';
        else if (/conclusion for which|author.*conclusion|conclusion of the argument|expresses? the conclusion|concludes? that/.test(tail)) topic = 'Conclusion';
        else if (/cannot be true|not consistent|could be true except|must be false/.test(tail)) topic = 'Conditional / Deductive Logic';
        else if (/can be inferred|may be inferred|properly inferred|validly inferred|inferences? can be drawn|most reliable inference|must (also )?be true|follows logically|conclusions? can (most )?(properly )?be drawn|logically (derived|deduced|concluded)|most strongly supports? which|supported by the (statements|information)/.test(tail)) topic = 'Inference';
        else if (/interpreted .* to imply|clarify the meaning|opinion .* based primarily|invites? which.*conclusion|best describes how .* counters/.test(tail)) topic = 'Interpretation';
        else if (/which .*?(plan|policy|strategy|action|recommendation)|best prospects for|most likely to minimize|most effective way|should .* (do|use|adopt)|advisable to/.test(tail)) topic = 'Plan / Decision';
        if (topic) q.topic = topic;
        q.type = q.topic; q.family = TOPIC_FAMILY[q.topic] || 'Other';
      }
      const EXPLANATION_GUIDE = {
        Assumption: 'Identify the conclusion and the missing link it requires. The correct option is necessary for that reasoning; negating it would damage the argument.',
        Strengthen: 'Identify the conclusion, then choose the new fact that most increases its likelihood or reinforces the connection between evidence and conclusion.',
        Weaken: 'Identify the conclusion, then look for an alternative cause, counterexample, missing distinction, or fact that makes the conclusion less likely.',
        'Paradox / Explain': 'The correct option supplies a fact that allows both apparently conflicting observations to be true at the same time.',
        Inference: 'Use only the stated information. The correct option must follow from it without adding an unsupported assumption.',
        Conclusion: 'Separate supporting statements from what they are offered to establish. The correct option captures that final claim.',
        'Main Point': 'Choose the statement that best represents the passage’s central claim rather than a supporting detail.',
        Flaw: 'Describe the precise gap between the evidence and conclusion, without merely saying that the argument lacks evidence.',
        Evaluate: 'The correct question matters because different answers to it would strengthen or weaken the conclusion.',
        'Complete the Passage': 'Continue the author’s existing line of reasoning; the correct ending follows from the preceding claims and matches their direction.',
        'Parallel Reasoning': 'Match the logical structure—premises, conclusion, and validity—not the subject matter or vocabulary.',
        'Conditional / Deductive Logic': 'Translate the conditions carefully and apply only valid implications, including contrapositives where appropriate.',
        Principle: 'Match the abstract rule to the facts, checking that every condition required by the rule is satisfied.',
        'Method / Point at Issue': 'Compare what each speaker commits to and identify the reasoning move or proposition on which their positions differ.',
        'Role / Function': 'Determine whether the cited statement is evidence, an intermediate conclusion, the main conclusion, background, or an opposing view.',
        'Argument Structure': 'Track how the argument proceeds—such as analogy, example, elimination, causal reasoning, or responding to an objection.',
        Interpretation: 'Use the surrounding statements to determine what the speaker or author must mean in context.',
        'Plan / Decision': 'Test whether the option advances the stated objective while respecting the constraints and avoiding a predictable failure.',
        Other: 'Compare each choice directly with the exact task in the question stem and eliminate choices that go beyond or conflict with the passage.'
      };
      function buildExplanation(q) { const choice = q.choices.find(c => c.label === q.answer); if (!q.answer || !choice) return { answer: 'Source key unavailable', answerText: '', reasoning: 'The supplied PDF does not provide a usable answer key for this item, so the platform excludes it from scored accuracy rather than inventing a solution.' }; return { answer: `Option ${q.answer}`, answerText: choice.text, reasoning: EXPLANATION_GUIDE[q.type] || EXPLANATION_GUIDE.Other } }
      DATA.questions.forEach(q => { classifyQuestion(q); q.explanation = buildExplanation(q) });
      const state = { view: 'dashboard', selectedTest: null, selectedSection: null, topicFilter: new Set(), topicCount: 10, session: null, topicStrategy: 'random', errorFilter: 'All', errorStatus: 'Open', pages: {}, confirmReset: false, analysis: null, toast: null };
      const app = document.getElementById('app');
      const qById = new Map(DATA.questions.map(q => [q.id, q]));
      const meta = DATA.metadata;
      let toastTimer = null, saveTimer = null;

      function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
      function solutionHTML(q, attempt) { const x = q.explanation, status = attempt?.correct === true ? 'Correct' : attempt?.correct === false ? 'Incorrect' : 'Not scored'; return `<div class="solution-panel ${attempt?.correct === false ? 'incorrect' : ''}"><div class="solution-title"><span>Solution · ${esc(q.type)}</span><span class="${attempt?.correct === true ? 'good' : attempt?.correct === false ? 'bad' : 'warn'}">${status}</span></div><div class="solution-answer"><strong>${esc(x.answer)}</strong>${x.answerText ? ` — ${esc(x.answerText)}` : ''}</div><div class="solution-reasoning"><strong>Reasoning approach:</strong> ${esc(x.reasoning)}</div><div class="solution-disclaimer">Generated study guidance based on the PDF answer key and classified question type; it is not an authored explanation from the source PDF.</div></div>` }
      function analysisModal() { const ref = state.analysis; if (!ref) return ''; const sessions = store().sessions || [], s = sessions.find(x => x.id === ref.sessionId) || (state._result?.id === ref.sessionId ? state._result : null), q = qById.get(ref.qid), a = s?.answers?.[ref.qid]; if (!q) return ''; return `<div class="modal analysis-modal" role="dialog" aria-modal="true" aria-labelledby="analysis-title"><div class="modal-card"><div class="row between"><div><strong id="analysis-title">Question ${q.number} analysis</strong><div class="tiny muted">${esc(q.family)} · ${esc(q.type)} · ${esc(displayTestTitle(q.corpus, q.test, q.section))}</div></div><button class="btn small" data-action="close-analysis">Close</button></div><div class="q-stem">${esc(q.prompt)}</div><div>${q.choices.map(c => `<div class="choice ${c.label === q.answer ? 'selected' : ''}"><span class="letter">${c.label}</span><span>${esc(c.text)}${c.label === a?.selected ? ' <span class="tiny muted">· Your answer</span>' : ''}</span></div>`).join('')}</div>${solutionHTML(q, a)}</div></div>` }
      function uid(prefix = 'id') { return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8) }
      function loadStore() { try { const data = JSON.parse(localStorage.getItem(STORE) || '{"sessions":[],"errors":[],"notes":{}}'); (data.sessions || []).forEach(s => Object.entries(s.answers || {}).forEach(([qid, a]) => { a.qid = qid; a.time = Number(s.times?.[qid]) || 0 })); return data } catch { return { sessions: [], errors: [], notes: {} } } }
      function saveStore(s) { localStorage.setItem(STORE, JSON.stringify(s)) }
      function loadCurrent() { try { const s = JSON.parse(localStorage.getItem(CURRENT) || 'null'); if (s) Object.entries(s.answers || {}).forEach(([qid, a]) => { a.qid = qid; a.time = Number(s.times?.[qid]) || 0 }); return s } catch { return null } }
      function saveCurrent() { if (state.session) { state.session.updatedAt = Date.now(); localStorage.setItem(CURRENT, JSON.stringify(state.session)) } }
      function clearCurrent() { localStorage.removeItem(CURRENT) }
      function store() { return loadStore() }
      function notify(msg) { state.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { state.toast = null; render() }, 2200) }
      function fmtSec(sec) { sec = Math.max(0, Math.round(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}` }
      function pct(a, b) { return b ? Math.round(a / b * 100) : 0 }
      function todayKey(ts = Date.now()) { return new Date(ts).toISOString().slice(0, 10) }
      function sessionSummary(s) { const values = Object.values(s.answers || {}), total = s.questionIds.length, answered = values.filter(a => a.selected).length, gradable = values.filter(a => a.selected && a.correct !== null && a.correct !== undefined).length, correct = values.filter(a => a.correct === true).length, time = Object.values(s.times || {}).reduce((a, b) => a + b, 0), unkeyed = s.questionIds.filter(id => !qById.get(id)?.answer).length, skipped = Math.max(0, total - answered); return { total, answered, gradable, unkeyed, skipped, correct, time, accuracy: pct(correct, gradable), score: pct(correct, gradable) } }
      function getQuestions(ids) { return ids.map(id => qById.get(id)).filter(Boolean) }
      function displayTestTitle(corpus, test, section) { return `CAT · Test ${test}${section && section !== 'Main' ? ' · ' + section : ''}` }
      function nav() { return `<div class="topbar"><div class="topbar-inner"><div class="brand">CR Practice Lab<small>CAT</small></div><div class="nav">${[['dashboard', 'Dashboard'], ['tests', 'CAT Tests'], ['topics', 'Focused Practice'], ['errors', 'Error Log'], ['reports', 'Reports']].map(([v, l]) => `<button data-view="${v}" class="${state.view === v ? 'active' : ''}">${l}</button>`).join('')}</div><div class="spacer"></div><button class="btn small" data-action="resume">${state.session ? 'Resume' : 'Quick Practice'}</button></div></div>` }

      function dashboard() {
        const st = store(), sessions = st.sessions || [], attempts = sessions.flatMap(s => Object.values(s.answers || {}).map(a => ({ ...a, session: s }))), answered = attempts.filter(a => a.selected), correct = answered.filter(a => a.correct);
        const avgTime = answered.length ? Math.round(answered.reduce((a, b) => a + (b.time || 0), 0) / answered.length) : 0;
        const recent = sessions.slice().sort((a, b) => b.createdAt - a.createdAt).slice(0, 6);
        const topicMap = {}; answered.forEach(a => { const q = qById.get(a.qid); if (!q) return; const k = q.topic; topicMap[k] ??= { c: 0, r: 0, t: 0 }; topicMap[k].c++; topicMap[k].r += a.correct ? 1 : 0; topicMap[k].t += a.time || 0 });
        const topicRows = Object.entries(topicMap).map(([k, v]) => ({ k, ...v, acc: pct(v.r, v.c) })).sort((a, b) => b.acc - a.acc);
        const days = {}; answered.forEach(a => { const d = todayKey(a.session.createdAt); days[d] ??= { a: 0, c: 0 }; days[d].a++; days[d].c += a.correct ? 1 : 0 });
